name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  stewardship:
    name: Stewardship checks and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install toolkit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Stewardship compliance checks
        run: ds-steward check

      - name: Pytest suite
        run: pytest -v

      - name: Regenerate stewardship dashboard
        run: ds-steward dashboard --output docs/dashboard.html

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: stewardship-dashboard
          path: docs/dashboard.html
