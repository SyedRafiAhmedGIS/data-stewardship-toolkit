dataset_id: sample_air_quality
title: Sample Air Quality Measurements (Synthetic)
description: Daily synthetic air-quality measurements for two urban monitoring sites
  (ST-A, ST-B) covering 1-14 January 2024. Variables include PM2.5, PM10, NO2 and
  air temperature. The data are entirely synthetic and exist to demonstrate the stewardship
  workflow; they describe no real location.
