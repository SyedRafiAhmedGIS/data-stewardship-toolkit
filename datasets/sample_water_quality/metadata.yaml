dataset_id: sample_water_quality
title: Sample Water Quality Time Series (Synthetic)
description: Bi-monthly synthetic water quality measurements for two river stations
  (WQ-01, WQ-02) from January to June 2024. Parameters include pH, dissolved oxygen,
  turbidity and electrical conductivity. The data are entirely synthetic and exist
  to demonstrate the stewardship workflow.
