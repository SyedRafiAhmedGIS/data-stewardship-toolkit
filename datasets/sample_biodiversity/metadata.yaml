dataset_id: sample_biodiversity
title: Sample Biodiversity Observations (Synthetic)
description: Field observation records of selected flora and fauna across three sites
  (BIO-01 to BIO-03) in June 2024, covering meadow, hedgerow, pond-edge and wetland
  habitats. All records, species counts and observers are synthetic and exist to demonstrate
  the stewardship workflow.
